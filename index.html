<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholastic 學樂閱讀闖關玩</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #79c5e8; /* 與主視覺天空色相近的底色 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 遊戲主容器：保持 1:1 比例或自適應展示 */
    .game-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 1 / 1;
      background-image: url('images/bg-main.jpg');
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border-radius: 16px;
      overflow: hidden;
    }

    /* 點擊熱區通用樣式與發光特效 */
    .game-btn {
      position: absolute;
      display: block;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      border-radius: 20px;
      text-decoration: none;
    }

    .game-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* 滑鼠懸停發光與微放大動效 */
    .game-btn:hover {
      transform: scale(1.04);
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9))
              drop-shadow(0 0 30px rgba(255, 230, 0, 0.8));
    }

    /* 各關卡按鈕在首頁的定位（可依實際裁切圖片尺寸微調 % 數） */
    
    /* 1. 藍思值 700L 探索冒險 -> 連到「連連看」 */
    .btn-700l {
      top: 21%;
      left: 32%;
      width: 36%;
    }

    /* 2. 藍思值 600L 水上狂歡 -> 連到「對對碰」 */
    .btn-600l {
      top: 54%;
      left: 8%;
      width: 36%;
    }

    /* 3. 藍思值 400L 奇幻樂園 -> 連到「對答」 */
    .btn-400l {
      top: 60%;
      right: 8%;
      width: 36%;
    }
  </style>
</head>
<body>

  <main class="game-container">
    <!-- 按鈕 1：700L 探索冒險 -> 連連看 -->
    <a href="match.html" class="game-btn btn-700l" title="進入 700L 探索冒險：連連看">
      <img src="images/btn-700l.png" alt="700L 探索冒險">
    </a>

    <!-- 按鈕 2：600L 水上狂歡 -> 對對碰 -->
    <a href="memory.html" class="game-btn btn-600l" title="進入 600L 水上狂歡：對對碰">
      <img src="images/btn-600l.png" alt="600L 水上狂歡">
    </a>

    <!-- 按鈕 3：400L 奇幻樂園 -> 對答 -->
    <a href="quiz.html" class="game-btn btn-400l" title="進入 400L 奇幻樂園：閱讀對答">
      <img src="images/btn-400l.png" alt="400L 奇幻樂園">
    </a>
  </main>

</body>
</html>
