<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholastic 學樂閱讀闖關玩</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #79c5e8; /* 與天空主色相近的底色 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 遊戲主容器 */
    .game-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 1 / 1;
      background-image: url('images/bg-main.jpg');
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border-radius: 16px;
      overflow: hidden;
    }

    /* 按鈕通用樣式 */
    .game-btn {
      position: absolute;
      display: block;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      text-decoration: none;
    }

    .game-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* 三個關卡按鈕滑鼠懸停：金色/白色發光 */
    .level-btn:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9))
              drop-shadow(0 0 30px rgba(255, 230, 0, 0.8));
    }

    /* 三個關卡按鈕位置 */
    .btn-700l {
      top: 21%;
      left: 32%;
      width: 36%;
    }

    .btn-600l {
      top: 54%;
      left: 8%;
      width: 36%;
    }

    .btn-400l {
      top: 60%;
      right: 8%;
      width: 36%;
    }

    /* ★ 右上方外部連結按鈕 ★ */
    .btn-top-right {
      top: 3.5%;
      right: 4%;
      width: 11%;
      z-index: 20;
    }

    /* 右上角按鈕專屬懸停效果：橘紅溫暖光暈 + 輕微上浮放大 */
    .btn-top-right:hover {
      transform: scale(1.1) translateY(-3px);
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.95))
              drop-shadow(0 0 25px rgba(255, 90, 30, 0.85));
    }
  </style>
</head>
<body>

  <main class="game-container">
    <!-- ★ 右上方外部連結按鈕（請將 href 換成你想連到的目標網址） ★ -->
    <a href="https://www.tangao.com.tw/" target="_blank" rel="noopener noreferrer" class="game-btn btn-top-right" title="前往官方網站">
      <img src="images/btn-logo.png" alt="官方連結">
    </a>

    <!-- 關卡 1：700L 探索冒險 -> 連連看 -->
    <a href="match.html" class="game-btn level-btn btn-700l" title="700L 探索冒險：連連看">
      <img src="images/btn-700l.png" alt="700L 探索冒險">
    </a>

    <!-- 關卡 2：600L 水上狂歡 -> 對對碰 -->
    <a href="memory.html" class="game-btn level-btn btn-600l" title="600L 水上狂歡：對對碰">
      <img src="images/btn-600l.png" alt="600L 水上狂歡">
    </a>

    <!-- 關卡 3：400L 奇幻樂園 -> 對答 -->
    <a href="quiz.html" class="game-btn level-btn btn-400l" title="400L 奇幻樂園：閱讀對答">
      <img src="images/btn-400l.png" alt="400L 奇幻樂園">
    </a>
  </main>

</body>
</html>
