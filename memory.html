<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>600L 水上狂歡 - 翻牌對對碰</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #e0f7fa, #80deea);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 { color: #00695c; font-size: 1.8rem; margin-bottom: 6px; }
    p { color: #004d40; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 110px);
      gap: 14px;
      perspective: 1000px;
    }
    @media (max-width: 500px) {
      .grid { grid-template-columns: repeat(3, 90px); gap: 10px; }
    }

    .card {
      width: 100%;
      height: 110px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card.matched { cursor: default; }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      padding: 8px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .card-front {
      background: linear-gradient(135deg, #00acc1, #00838f);
      color: white;
      font-size: 1.5rem;
    }
    .card-back {
      background: white;
      color: #00695c;
      font-size: 0.85rem;
      border: 2px solid #00acc1;
      transform: rotateY(180deg);
    }

    .win-box {
      display: none;
      margin-top: 24px;
      text-align: center;
      background: white;
      padding: 20px 32px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    .nav-btn {
      margin-top: 14px;
      display: inline-block;
      padding: 10px 24px;
      background: #00897b;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌊 600L 水上狂歡：書本記憶對對碰</h1>
    <p>找出兩張相同的書名牌卡！</p>
  </header>

  <div class="grid" id="grid"></div>

  <div class="win-box" id="win-box">
    <h2>🎉 恭喜通關！你的記憶力超棒！</h2>
    <a href="index.html" class="nav-btn">返回遊樂園主頁</a>
  </div>

  <script>
    const items = [
      "Diary of a Pug", "Owl Diaries", "Press Start!",
      "Poppleton", "Dragon", "Mister Shivers"
    ];
    // 兩兩成對並洗牌
    const deck = [...items, ...items].sort(() => Math.random() - 0.5);

    const grid = document.getElementById("grid");
    const winBox = document.getElementById("win-box");
    let flippedCards = [];
    let lockBoard = false;
    let matchedPairs = 0;

    deck.forEach(name => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.name = name;
      card.innerHTML = `
        <div class="card-face card-front">📖</div>
        <div class="card-face card-back">${name}</div>
      `;
      card.addEventListener("click", flipCard);
      grid.appendChild(card);
    });

    function flipCard() {
      if (lockBoard || this === flippedCards[0] || this.classList.contains("matched")) return;

      this.classList.add("flipped");
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        lockBoard = true;
        if (flippedCards[0].dataset.name === flippedCards[1].dataset.name) {
          flippedCards[0].classList.add("matched");
          flippedCards[1].classList.add("matched");
          matchedPairs++;
          flippedCards = [];
          lockBoard = false;
          if (matchedPairs === items.length) {
            winBox.style.display = "block";
          }
        } else {
          setTimeout(() => {
            flippedCards[0].classList.remove("flipped");
            flippedCards[1].classList.remove("flipped");
            flippedCards = [];
            lockBoard = false;
          }, 800);
        }
      }
    }
  </script>
</body>
</html>
