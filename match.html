<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>700L 探索冒險 - 連連看遊戲</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 { color: #1565c0; font-size: 1.8rem; margin-bottom: 8px; }
    p { color: #555; }
    
    .game-board {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 650px;
      background: #fff;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      gap: 30px;
    }
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-btn {
      padding: 16px 12px;
      border: 2px solid #90caf9;
      border-radius: 12px;
      background: #f8fafc;
      color: #333;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.25s ease;
      user-select: none;
    }
    .card-btn:hover:not(.matched) {
      background: #e3f2fd;
      border-color: #42a5f5;
      transform: translateY(-2px);
    }
    .card-btn.selected {
      background: #ffe082;
      border-color: #ffa000;
      box-shadow: 0 0 10px rgba(255, 160, 0, 0.5);
    }
    .card-btn.matched {
      background: #c8e6c9;
      border-color: #4caf50;
      color: #2e7d32;
      cursor: default;
      opacity: 0.85;
    }
    .card-btn.wrong {
      background: #ffcdd2;
      border-color: #e53935;
    }

    .modal {
      display: none;
      margin-top: 24px;
      text-align: center;
      background: #fff;
      padding: 20px 32px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
    .nav-btn {
      margin-top: 14px;
      display: inline-block;
      padding: 10px 24px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .nav-btn:hover { background: #1565c0; }
  </style>
</head>
<body>

  <header>
    <h1>📘 700L 探索冒險：書名與特徵連連看</h1>
    <p>先點選左側書名，再點選右側對應的描述完成配對！</p>
  </header>

  <div class="game-board">
    <div class="column" id="left-col"></div>
    <div class="column" id="right-col"></div>
  </div>

  <div class="modal" id="win-modal">
    <h2>🎉 太棒了！全部配對成功！</h2>
    <a href="index.html" class="nav-btn">返回遊樂園主頁</a>
  </div>

  <script>
    const pairs = [
      { id: 1, name: "Dragon Masters", match: "飛龍訓練師與神祕龍石" },
      { id: 2, name: "Eerie Elementary", match: "會動起來吃學生的活學校" },
      { id: 3, name: "Notebook of Doom", match: "擊退怪獸的秘密筆記" },
      { id: 4, name: "The Last Firehawk", match: "小松鼠 Tag 與最後一隻火鷹" }
    ];

    let selectedLeft = null;
    let selectedRight = null;
    let matchedCount = 0;

    const leftCol = document.getElementById("left-col");
    const rightCol = document.getElementById("right-col");
    const winModal = document.getElementById("win-modal");

    // 打亂右側順序
    const shuffledRight = [...pairs].sort(() => Math.random() - 0.5);

    // 渲染左側
    pairs.forEach(item => {
      const btn = document.createElement("div");
      btn.className = "card-btn";
      btn.textContent = item.name;
      btn.dataset.id = item.id;
      btn.onclick = () => selectLeft(btn);
      leftCol.appendChild(btn);
    });

    // 渲染右側
    shuffledRight.forEach(item => {
      const btn = document.createElement("div");
      btn.className = "card-btn";
      btn.textContent = item.match;
      btn.dataset.id = item.id;
      btn.onclick = () => selectRight(btn);
      rightCol.appendChild(btn);
    });

    function selectLeft(btn) {
      if (btn.classList.contains("matched")) return;
      if (selectedLeft) selectedLeft.classList.remove("selected");
      selectedLeft = btn;
      btn.classList.add("selected");
      checkPair();
    }

    function selectRight(btn) {
      if (btn.classList.contains("matched")) return;
      if (selectedRight) selectedRight.classList.remove("selected");
      selectedRight = btn;
      btn.classList.add("selected");
      checkPair();
    }

    function checkPair() {
      if (!selectedLeft || !selectedRight) return;

      if (selectedLeft.dataset.id === selectedRight.dataset.id) {
        selectedLeft.className = "card-btn matched";
        selectedRight.className = "card-btn matched";
        selectedLeft = null;
        selectedRight = null;
        matchedCount++;
        if (matchedCount === pairs.length) {
          winModal.style.display = "block";
        }
      } else {
        selectedLeft.classList.add("wrong");
        selectedRight.classList.add("wrong");
        const tempL = selectedLeft;
        const tempR = selectedRight;
        setTimeout(() => {
          tempL.classList.remove("selected", "wrong");
          tempR.classList.remove("selected", "wrong");
        }, 500);
        selectedLeft = null;
        selectedRight = null;
      }
    }
  </script>
</body>
</html>
